services:
  postgres:
    image: postgres:16-alpine
    container_name: aero-search-postgres
    environment:
      POSTGRES_USER: aero
      POSTGRES_PASSWORD: aero
      POSTGRES_DB: aero_search
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aero -d aero_search"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
